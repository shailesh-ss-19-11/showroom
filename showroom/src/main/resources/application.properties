spring.application.name=showroom

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/showroom_java}
spring.datasource.username=${DB_USERNAME:showroom}
spring.datasource.password=${DB_PASSWORD:showroom}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-days=7

app.cors.allowed-origins=${CLIENT_URL:http://localhost:5173}
app.public-url=${PUBLIC_URL:http://localhost:8080}

app.admin.name=${ADMIN_NAME:Admin}
app.admin.email=${ADMIN_EMAIL:admin@varexa.in}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

app.garage.endpoint=${GARAGE_ENDPOINT:http://localhost:3900}
app.garage.region=${GARAGE_REGION:garage}
app.garage.bucket=${GARAGE_BUCKET:bike-photos}
app.garage.access-key-id=${GARAGE_ACCESS_KEY_ID:}
app.garage.secret-access-key=${GARAGE_SECRET_ACCESS_KEY:}
